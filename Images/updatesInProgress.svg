<svg xmlns="http://www.w3.org/2000/svg" width="370" height="38" viewBox="0 0 370 38">
  <rect width="368" height="36" x="1" y="1" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Outer Pulse Ring -->
  <circle cx="22" cy="19" r="4.5" fill="#0284c7" opacity="0.6">
    <animate attributeName="r" values="4.5;9;4.5" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Solid Core Dot -->
  <circle cx="22" cy="19" r="4.5" fill="#0284c7" />

  <!-- Label Text -->
  <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#1e293b">
    Portfolio updates in progress … more coming soon
  </text>
</svg>
